<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#ef8f5f"/>
  
  <!-- Calculator icon -->
  <g transform="translate(16, 16)">
    <!-- Display -->
    <rect x="2" y="2" width="28" height="10" rx="1.5" fill="#fff0e8"/>
    
    <!-- Display text/indicator -->
    <circle cx="24" cy="7" r="1.5" fill="#ef8f5f"/>
    
    <!-- Buttons grid -->
    <!-- Row 1 -->
    <rect x="2" y="14" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
    <rect x="9" y="14" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
    <rect x="16" y="14" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
    <rect x="23" y="14" width="7" height="6" rx="1" fill="#f26f3e"/>
    
    <!-- Row 2 -->
    <rect x="2" y="21" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
    <rect x="9" y="21" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
    <rect x="16" y="21" width="6" height="6" rx="1" fill="white" opacity="0.9"/>
    <rect x="23" y="21" width="7" height="6" rx="1" fill="#f26f3e"/>
  </g>
</svg>